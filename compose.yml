services:
  imgutil:
    build: .
    ports:
      - "127.0.0.1:8092:8092"
    environment:
      GRAPHICS_API_KEY: ${GRAPHICS_API_KEY:?请设置 GRAPHICS_API_KEY}
      GRAPHICS_WORKERS: ${GRAPHICS_WORKERS:-2}
      GRAPHICS_MAX_DIMENSION: ${GRAPHICS_MAX_DIMENSION:-8192}
      GRAPHICS_MAX_PIXELS: ${GRAPHICS_MAX_PIXELS:-8000000}
      GRAPHICS_FONT_DIRECTORY: /app/fonts
      GRAPHICS_REQUIRED_FONTS: ${GRAPHICS_REQUIRED_FONTS:-}
      OSS_ENABLED: ${OSS_ENABLED:-false}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
    volumes:
      - graphics-data:/app/data
      - ${GRAPHICS_FONTS_HOST_DIRECTORY:-./fonts}:/app/fonts:ro
    mem_limit: 768m
    cpus: 2.0
    pids_limit: 128
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  graphics-data:
